<svg xmlns="http://www.w3.org/2000/svg" width="900" height="220" viewBox="0 0 900 220">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d0018"/>
      <stop offset="100%" stop-color="#150330"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="wordglow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bearglow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.55"/>
    </filter>
    <filter id="sparkglow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="220" fill="url(#bg)" rx="12"/>

  <!-- Border -->
  <rect width="900" height="220" fill="none" rx="12" stroke="#5b21b6" stroke-width="1" opacity="0.4"/>

  <!-- Subtle grid -->
  <g opacity="0.04" stroke="#a855f7" stroke-width="0.5">
    <line x1="0" y1="44" x2="900" y2="44"/>
    <line x1="0" y1="88" x2="900" y2="88"/>
    <line x1="0" y1="132" x2="900" y2="132"/>
    <line x1="0" y1="176" x2="900" y2="176"/>
    <line x1="150" y1="0" x2="150" y2="220"/>
    <line x1="300" y1="0" x2="300" y2="220"/>
    <line x1="450" y1="0" x2="450" y2="220"/>
    <line x1="600" y1="0" x2="600" y2="220"/>
    <line x1="750" y1="0" x2="750" y2="220"/>
  </g>

  <!-- ========== LEFT TITLE AREA ========== -->
  <text x="38" y="73" font-family="'Courier New',Courier,monospace" font-size="40" font-weight="bold"
        fill="#ffffff" letter-spacing="-1" filter="url(#glow)">skill-warden</text>
  <text x="40" y="98" font-family="'Courier New',Courier,monospace" font-size="13"
        fill="#a78bfa" letter-spacing="1">AI Skill Security Scanner</text>
  <line x1="40" y1="110" x2="305" y2="110" stroke="#5b21b6" stroke-width="1" opacity="0.6"/>

  <!-- Badge pills -->
  <rect x="40"  y="120" width="62" height="20" rx="10" fill="#3b0764" opacity="0.9"/>
  <text x="71"  y="134" font-family="monospace" font-size="11" fill="#c4b5fd" text-anchor="middle">W3OSC</text>
  <rect x="110" y="120" width="48" height="20" rx="10" fill="#1e1b4b" opacity="0.9"/>
  <text x="134" y="134" font-family="monospace" font-size="11" fill="#818cf8" text-anchor="middle">MIT</text>
  <rect x="166" y="120" width="50" height="20" rx="10" fill="#172554" opacity="0.9"/>
  <text x="191" y="134" font-family="monospace" font-size="11" fill="#60a5fa" text-anchor="middle">PyPI</text>

  <!-- ========== INCOMING BAD WORDS ========== -->

  <!-- "IGNORE ALL" - top, flying right -->
  <g transform="translate(345,52) rotate(-9)" filter="url(#wordglow)">
    <line x1="-28" y1="-4" x2="-6" y2="-4" stroke="#ef4444" stroke-width="1.5" opacity="0.45"/>
    <line x1="-36" y1="0"  x2="-6" y2="0"  stroke="#ef4444" stroke-width="1"   opacity="0.3"/>
    <text font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#ef4444">IGNORE ALL</text>
  </g>

  <!-- "DAN MODE" - upper-mid -->
  <g transform="translate(360,90) rotate(-5)" filter="url(#wordglow)">
    <line x1="-30" y1="-4" x2="-6" y2="-4" stroke="#f97316" stroke-width="1.5" opacity="0.45"/>
    <line x1="-40" y1="0"  x2="-6" y2="0"  stroke="#f97316" stroke-width="1"   opacity="0.3"/>
    <text font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#f97316">DAN MODE</text>
  </g>

  <!-- "&lt;&lt;SYS&gt;&gt;" token smuggling - mid -->
  <g transform="translate(390,124) rotate(-3)" filter="url(#wordglow)">
    <line x1="-24" y1="-4" x2="-6" y2="-4" stroke="#22d3ee" stroke-width="1.5" opacity="0.4"/>
    <text font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold" fill="#22d3ee">&lt;&lt;SYS&gt;&gt;</text>
  </g>

  <!-- "JAILBREAK" - lower, steeper angle -->
  <g transform="translate(330,162) rotate(-14)" filter="url(#wordglow)">
    <line x1="-32" y1="-4" x2="-6" y2="-4" stroke="#dc2626" stroke-width="1.5" opacity="0.45"/>
    <line x1="-42" y1="0"  x2="-6" y2="0"  stroke="#dc2626" stroke-width="1"   opacity="0.3"/>
    <text font-family="'Courier New',Courier,monospace" font-size="13" font-weight="bold" fill="#dc2626">JAILBREAK</text>
  </g>

  <!-- "OVERRIDE" - close to bear, getting blocked -->
  <g transform="translate(468,108) rotate(-6)" filter="url(#wordglow)">
    <text font-family="'Courier New',Courier,monospace" font-size="12" font-weight="bold" fill="#fb923c" opacity="0.85">OVERRIDE</text>
  </g>

  <!-- ========== IMPACT SPARKS at left paw (~x=590, y=108) ========== -->
  <g filter="url(#sparkglow)">
    <line x1="590" y1="108" x2="572" y2="93"  stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="590" y1="108" x2="568" y2="108" stroke="#ef4444" stroke-width="2.5" stroke-linecap="round" opacity="0.9"/>
    <line x1="590" y1="108" x2="573" y2="122" stroke="#fbbf24" stroke-width="2.5" stroke-linecap="round" opacity="0.95"/>
    <line x1="590" y1="108" x2="578" y2="92"  stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <line x1="590" y1="108" x2="577" y2="122" stroke="#fb923c" stroke-width="2"   stroke-linecap="round" opacity="0.8"/>
    <line x1="590" y1="108" x2="566" y2="100" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
    <circle cx="590" cy="108" r="5"  fill="#fbbf24" opacity="0.85"/>
    <circle cx="590" cy="108" r="11" fill="none" stroke="#fbbf24" stroke-width="1" opacity="0.3"/>
    <!-- small debris dots -->
    <circle cx="575" cy="96"  r="2" fill="#ffffff" opacity="0.7"/>
    <circle cx="567" cy="113" r="2" fill="#fbbf24" opacity="0.6"/>
    <circle cx="572" cy="120" r="1.5" fill="#ef4444" opacity="0.6"/>
  </g>

  <!-- ========== BEAR FIGURE (center: 710, 108) ========== -->

  <!-- Ground shadow -->
  <ellipse cx="710" cy="210" rx="58" ry="8" fill="#7c3aed" opacity="0.2"/>

  <!-- Legs -->
  <ellipse cx="685" cy="192" rx="23" ry="21" fill="#2e1065"/>
  <ellipse cx="735" cy="192" rx="23" ry="21" fill="#2e1065"/>
  <!-- Feet -->
  <ellipse cx="682" cy="208" rx="26" ry="10" fill="#1e0a4e"/>
  <ellipse cx="738" cy="208" rx="26" ry="10" fill="#1e0a4e"/>

  <!-- Body -->
  <ellipse cx="710" cy="152" rx="52" ry="54" fill="#2e1065" filter="url(#bearglow)"/>

  <!-- Belly lighter patch -->
  <ellipse cx="710" cy="155" rx="30" ry="32" fill="#3b0764" opacity="0.7"/>

  <!-- Shield emblem on chest -->
  <path d="M710 130 L726 136 L726 150 Q726 161 710 166 Q694 161 694 150 L694 136 Z"
        fill="none" stroke="#a855f7" stroke-width="1.8" opacity="0.75"/>
  <text x="710" y="154" font-family="monospace" font-size="10" fill="#c4b5fd"
        text-anchor="middle" opacity="0.9">W</text>

  <!-- RIGHT arm (raised up/back) -->
  <path d="M750 130 Q772 112 768 88 Q764 78 757 75"
        stroke="#2e1065" stroke-width="28" stroke-linecap="round" fill="none"/>
  <!-- Right paw -->
  <circle cx="754" cy="74" r="19" fill="#2e1065"/>
  <!-- Right paw pads -->
  <circle cx="746" cy="67" r="5.5" fill="#4c1d95"/>
  <circle cx="760" cy="65" r="5.5" fill="#4c1d95"/>
  <circle cx="765" cy="77" r="5.5" fill="#4c1d95"/>
  <circle cx="750" cy="80" r="5.5" fill="#4c1d95"/>

  <!-- LEFT arm (fully extended LEFT, blocking the words) -->
  <path d="M670 128 Q638 116 614 110 Q600 107 593 108"
        stroke="#2e1065" stroke-width="30" stroke-linecap="round" fill="none"/>
  <!-- Left paw (open palm facing words) -->
  <circle cx="589" cy="108" r="21" fill="#2e1065"/>
  <!-- Left paw pads (fingers pointing left at the words) -->
  <circle cx="573" cy="100" r="5.5" fill="#4c1d95"/>
  <circle cx="570" cy="111" r="5.5" fill="#4c1d95"/>
  <circle cx="576" cy="121" r="5.5" fill="#4c1d95"/>
  <circle cx="567" cy="107" r="5"   fill="#4c1d95"/>

  <!-- Head -->
  <circle cx="710" cy="86" r="42" fill="#2e1065" filter="url(#bearglow)"/>

  <!-- Outer ears -->
  <circle cx="677" cy="54" r="17" fill="#2e1065"/>
  <circle cx="743" cy="54" r="17" fill="#2e1065"/>
  <!-- Inner ears -->
  <circle cx="677" cy="54" r="10" fill="#4c1d95"/>
  <circle cx="743" cy="54" r="10" fill="#4c1d95"/>

  <!-- Muzzle -->
  <ellipse cx="710" cy="101" rx="19" ry="14" fill="#3b0764"/>

  <!-- Eyes - determined / fighting glare -->
  <ellipse cx="696" cy="82" rx="9" ry="10" fill="#0d0018"/>
  <ellipse cx="724" cy="82" rx="9" ry="10" fill="#0d0018"/>
  <!-- Glowing irises -->
  <circle cx="696" cy="82" r="6" fill="#7c3aed"/>
  <circle cx="724" cy="82" r="6" fill="#7c3aed"/>
  <!-- Bright pupils -->
  <circle cx="696" cy="82" r="3" fill="#e040fb"/>
  <circle cx="724" cy="82" r="3" fill="#e040fb"/>
  <!-- Eye shine -->
  <circle cx="692" cy="78" r="2" fill="#ffffff" opacity="0.85"/>
  <circle cx="720" cy="78" r="2" fill="#ffffff" opacity="0.85"/>

  <!-- Angry furrowed eyebrows -->
  <path d="M686 71 Q692 68 700 72" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round" fill="none"/>
  <path d="M734 71 Q728 68 720 72" stroke="#c4b5fd" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <ellipse cx="710" cy="96" rx="8" ry="6" fill="#0d0018"/>

  <!-- Determined mouth / snarl -->
  <path d="M700 106 Q707 112 710 110 Q713 112 720 106"
        stroke="#0d0018" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Protective aura ring around bear -->
  <ellipse cx="710" cy="130" rx="90" ry="105"
           fill="none" stroke="#7c3aed" stroke-width="1.5"
           stroke-dasharray="6 4" opacity="0.3"/>

</svg>
