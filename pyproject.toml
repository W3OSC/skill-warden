[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "skill-warden"
version = "1.0.0"
description = "Security scanner for GitHub Copilot skills - detect prompt injection, jailbreaks, secret grabbing, and more"
readme = "README.md"
license = {text = "MIT"}
authors = [{name = "W3OSC", email = "security@w3osc.org"}]
keywords = ["security", "llm", "copilot", "skills", "static-analysis", "prompt-injection"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.28",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.scripts]
skill-warden = "skill_warden.main:main"

[project.urls]
Homepage = "https://github.com/W3OSC/skill-warden"
Repository = "https://github.com/W3OSC/skill-warden"
Issues = "https://github.com/W3OSC/skill-warden/issues"

[tool.hatch.build.targets.wheel]
packages = ["skill_warden"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.coverage.run]
source = ["skill_warden"]
omit = ["tests/*"]
