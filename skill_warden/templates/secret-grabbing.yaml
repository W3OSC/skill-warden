id: secret-grabbing
version: "1.0.0"
name: Secret Grabbing
severity: high
category: advisory
advisory: true
description: >
  Detects references to sensitive files, credentials, environment variables, and cryptographic
  key material that suggest a skill is attempting to exfiltrate secrets from the user's system.
impact: >
  A skill that references SSH keys, cloud credentials, wallet keystores, or environment variables
  could instruct the AI to read and transmit sensitive secrets, compromising accounts and assets.
action-items:
  - "Remove all references to credential files, key stores, and secret environment variables."
  - "Audit skill for instructions that involve reading, printing, or transmitting sensitive paths."
  - "Verify the skill's stated purpose justifies any filesystem access it requests."
references:
  - "https://github.com/W3OSC/web3-opsec-standard"
  - "https://owasp.org/www-project-top-10-for-large-language-model-applications/"
  - "https://cheatsheetseries.owasp.org/cheatsheets/Secrets_Management_Cheat_Sheet.html"
patterns:
  - '(?i)~/\.ssh/(id_rsa|id_ed25519|id_dsa|id_ecdsa|authorized_keys|known_hosts)'
  - '(?i)~/\.aws/(credentials|config)\b'
  - '(?i)~/\.kube/config\b'
  - '(?i)~/\.docker/config\.json\b'
  - '(?i)~/\.gnupg/'
  - '(?i)~/\.netrc\b'
  - '(?i)~/\.npmrc\b'
  - '(?i)~/\.pypirc\b'
  - '(?i)~/\.(bash_history|zsh_history|sh_history)\b'
  - '(?i)/etc/(passwd|shadow|sudoers)\b'
  - '(?im)(^|[\s"''\/])\.env(\.[a-zA-Z]+)?\b'
  - '(?i)~/\.foundry/keystores/'
  - '(?i)~/\.ethereum/keystore/'
  - '(?i)~/\.config/solana/id\.json\b'
  - '(?i)~/\.brownie/accounts/'
  - '(?i)~/\.bitcoin/wallet\.dat\b'
  - 'nkbihfbeogaeaoehlefnkodbefgpgknn'
  - '(?i)process\.env\.(secret|api_?key|token|password|private_?key|auth|credential|access_?key|github_token|aws_)'
  - '(?i)os\.environ(\[|\.get\()["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key|aws_)'
  - '(?i)getenv\(["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key)'
  - '(?i)ENV\[["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key)'
  - '\$\{?(SECRET|API_KEY|PRIVATE_KEY|ACCESS_KEY|PASSWORD|AUTH_TOKEN|GITHUB_TOKEN|AWS_SECRET_ACCESS_KEY|DATABASE_URL|DB_PASSWORD|MNEMONIC|SEED_PHRASE|DEPLOYER_PRIVATE_KEY|WALLET_PRIVATE_KEY)\}?'
  - '(?i)System\.getenv\(["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key)'
  - '(?i)env::var\(["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key)'
  - '(?i)Environment\.GetEnvironmentVariable\(["''](secret|api_?key|token|password|private_?key|auth|credential|access_?key)'
